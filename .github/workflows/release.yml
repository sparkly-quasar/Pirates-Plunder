# Builds a release and publishes it on GitHub, the same files tools/package.sh
# makes on a Mac: the .dmg, the Windows .exe, the server package and
# SHA256SUMS.txt. Runs on a Mac (hdiutil makes the disk image).
#
# To release: set config/version in godot/project.godot, write
# godot/release-notes/v<version>.md (first line "# <title>", then the notes),
# merge to main, then either push the tag (git tag v0.9.0 && git push origin
# v0.9.0) or run this by hand on main (Actions > Release > Run workflow, with
# the tag), which creates the tag on that commit as it publishes. Published
# as the latest release, so the README's download links
# (releases/latest/download/...) always fetch it. Running it again for a
# published tag replaces its files and makes it the latest release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v0.9.0"
        required: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.1"

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Which tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: The tag matches the game's version
        run: |
          version=$(sed -n 's/^config\/version="\(.*\)"/\1/p' godot/project.godot)
          [ "v$version" = "${{ steps.tag.outputs.tag }}" ] || { echo "project.godot says $version, but the tag is ${{ steps.tag.outputs.tag }}"; exit 1; }
          [ -s "godot/release-notes/v$version.md" ] || { echo "no godot/release-notes/v$version.md"; exit 1; }

      - name: Godot and its export templates (cached)
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-macos

      - name: Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot-bin
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip -d ~/godot-bin
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz -d tpl
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          mv tpl/templates/* "$dest/"

      - name: Put godot on the PATH
        run: |
          mkdir -p ~/bin
          ln -sf ~/godot-bin/Godot.app/Contents/MacOS/Godot ~/bin/godot
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Import the project
        run: godot --headless --path godot --import || godot --headless --path godot --import

      - name: Build (tools/package.sh)
        run: godot/tools/package.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ steps.tag.outputs.tag }}
          notes=godot/release-notes/$tag.md
          title="$tag: $(head -1 "$notes" | sed 's/^# *//')"
          tail -n +2 "$notes" | sed '/./,$!d' > notes.md
          cd godot/build
          files="PiratesPlunder-macos.dmg PiratesPlunder-windows.exe PiratesPlunder-server-linux.tar.gz SHA256SUMS.txt"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
            gh release edit "$tag" --prerelease=false --latest
          else
            gh release create "$tag" $files --latest --target "$GITHUB_SHA" --title "$title" --notes-file ../../notes.md
          fi
